name: Refresh gift codes

on:
  schedule:
    # GitHub cron is UTC. Run at minute 0 of every hour.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-gift-codes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the source lists
        run: node scripts/refresh-gift-codes.mjs

      - name: Commit a changed code list
        run: |
          if git diff --quiet -- data/gift-codes.json; then
            echo "No gift-code changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gift-codes.json
          git commit -m "Refresh gift codes from the source list"
          git push
