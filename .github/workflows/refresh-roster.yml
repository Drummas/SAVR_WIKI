name: Refresh alliance roster

on:
  schedule:
    # GitHub cron is UTC. Server reset is 00:00 on the in-game clock (UTC-2).
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-roster
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read the alliance leaderboard
        run: node scripts/refresh-roster.mjs

      - name: Commit a changed roster
        run: |
          if git diff --quiet -- data/roster.json; then
            echo "No roster changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roster.json
          git commit -m "Refresh alliance roster from the leaderboard"
          git push
